# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!data/**"
    - "!reports/**"
    - "!**/*.sqlite3"
  tools:
    # Ruff is configured in pyproject.toml; there is no Pylint configuration.
    ruff:
      enabled: true
    pylint:
      enabled: false

chat:
  auto_reply: true
