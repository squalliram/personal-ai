<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Personal AI Command Centre</title>
<link rel="stylesheet" href="static/app.css">
<script src="static/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<section id="login-view" class="login" hidden>
  <div class="login-radar" aria-hidden="true"></div>
  <form id="login-form" class="card login-card" novalidate>
    <p class="eyebrow">PERSONAL AI</p>
    <h1>Command Centre</h1>
    <input id="username" name="username" type="text" autocomplete="username" value="jarvis" hidden>
    <label for="password">Passphrase</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
    <label class="remember" for="remember"><input id="remember" name="remember" type="checkbox"> Remember this device for 30 days</label>
    <button type="submit" class="primary">Sign in</button>
    <p id="login-status" role="status" aria-live="polite"></p>
  </form>
</section>
<div id="app-view" class="shell" hidden>
  <header class="topbar">
    <button id="menu-toggle" type="button" aria-expanded="false" aria-controls="nav">Menu</button>
    <span class="brand">Command Centre</span>
    <span id="permission-badge" class="badge" title="Session permission level"></span>
    <button id="logout" type="button">Sign out</button>
  </header>
  <nav id="nav" aria-label="Sections"><ul id="nav-list"></ul></nav>
  <main id="main" tabindex="-1">
    <h1 id="view-title"></h1>
    <p id="view-status" role="status" aria-live="polite"></p>
    <div id="view"></div>
  </main>
</div>
<div id="vault" class="vault" hidden aria-hidden="true">
  <svg class="vault-dial" viewBox="0 0 400 400" focusable="false">
    <circle class="vault-housing" cx="200" cy="200" r="188"/>
    <g class="vault-bolts">
      <g transform="rotate(22.5 200 200)"><rect class="vault-bolt" x="191" y="14" width="18" height="40" rx="2"/></g>
      <g transform="rotate(67.5 200 200)"><rect class="vault-bolt" x="191" y="14" width="18" height="40" rx="2"/></g>
      <g transform="rotate(112.5 200 200)"><rect class="vault-bolt" x="191" y="14" width="18" height="40" rx="2"/></g>
      <g transform="rotate(157.5 200 200)"><rect class="vault-bolt" x="191" y="14" width="18" height="40" rx="2"/></g>
      <g transform="rotate(202.5 200 200)"><rect class="vault-bolt" x="191" y="14" width="18" height="40" rx="2"/></g>
      <g transform="rotate(247.5 200 200)"><rect class="vault-bolt" x="191" y="14" width="18" height="40" rx="2"/></g>
      <g transform="rotate(292.5 200 200)"><rect class="vault-bolt" x="191" y="14" width="18" height="40" rx="2"/></g>
      <g transform="rotate(337.5 200 200)"><rect class="vault-bolt" x="191" y="14" width="18" height="40" rx="2"/></g>
    </g>
    <circle class="vault-housing vault-housing-inner" cx="200" cy="200" r="166"/>
    <circle class="vault-ticks" cx="200" cy="200" r="150"/>
    <circle class="vault-scan" cx="200" cy="200" r="150"/>
    <g class="vault-ring vault-ring-1"><circle cx="200" cy="200" r="126"/><rect class="vault-notch" x="195" y="62" width="10" height="24"/></g>
    <g class="vault-ring vault-ring-2"><circle cx="200" cy="200" r="100"/><rect class="vault-notch" x="196" y="91" width="8" height="18"/></g>
    <g class="vault-ring vault-ring-3"><circle cx="200" cy="200" r="76"/><rect class="vault-notch" x="197" y="118" width="6" height="14"/></g>
    <line class="vault-align" x1="200" y1="52" x2="200" y2="140"/>
    <circle class="vault-core" cx="200" cy="200" r="52"/>
    <text class="vault-locked" x="200" y="204">Locked</text>
    <g class="vault-granted"><text x="200" y="197">Access</text><text x="200" y="213">Granted</text></g>
  </svg>
  <p id="vault-caption" class="vault-caption"></p>
</div>
<noscript>JavaScript is required for the command centre.</noscript>
</body>
</html>
