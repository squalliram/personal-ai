name: CodeRabbit findings log

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coderabbit-findings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild docs/coderabbit/findings.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/coderabbit-findings.py
      - name: Commit when a finding changed
        run: |
          if git diff -I '^Generated by' --quiet -- docs/coderabbit/findings.md; then
            echo "No finding changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/coderabbit/findings.md
          git commit -m "CodeRabbit findings log: daily refresh"
          git push origin HEAD:main
