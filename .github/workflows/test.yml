name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENERGY_REQUIRE_PHP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Keep in sync with the ruff pin in pyproject.toml.
      - run: python -m pip install "ruff==0.16.10"
      - run: ruff check .
      - run: ruff format --check .
      - name: Verify PHP runtime and endpoint syntax
        run: |
          command -v php
          php --version
          php -l octopus_energy/refresh.php
      - run: python -m unittest discover -s tests -v
