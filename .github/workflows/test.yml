name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENERGY_REQUIRE_PHP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Keep in sync with the ruff pin in pyproject.toml.
      - run: python -m pip install "ruff==0.16.10"
      - run: ruff check .
      - run: ruff format --check .
      - name: Verify PHP runtime and endpoint syntax
        run: |
          command -v php
          php --version
          php -l octopus_energy/refresh.php
      - name: Install passkey dependencies (hash-pinned, as the deploy does)
        run: python -m pip install --no-deps --only-binary=:all: --require-hashes -r deploy/command-centre/requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Scan tracked files for committed secrets
        # High-signal patterns only, with length floors so test sentinels such as
        # "sk_live_SECRET" do not match. git grep exits 1 on no match, 2+ on error.
        run: |
          status=0
          git grep -nIEi '(sk_live_[a-z0-9]{16,}|sk-[a-z0-9]{20,}|xox[baprs]-[a-z0-9-]{10,}|-----begin (rsa |ec |openssh |pgp )?private key-----|pbkdf2_sha256$[0-9]+$[a-z0-9_-]{16,}$[a-z0-9+/=_-]{16,}|(api[_-]?key|secret|password|token)["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"'][a-z0-9+/=_-]{24,}["'"'"'])' -- . || status=$?
          case "$status" in
            0) echo "Possible committed secret found" >&2; exit 1;;
            1) echo "No committed secrets detected";;
            *) echo "Secret scan failed to run (exit $status)" >&2; exit 1;;
          esac
