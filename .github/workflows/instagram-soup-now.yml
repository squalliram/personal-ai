name: Owner soup reel and Story once

on:
  push:
    branches: [devin/1795457826-soup-reel-story]
    paths: [.github/workflows/instagram-soup-now.yml]

permissions:
  contents: read

concurrency:
  group: instagram-owner-soup-now
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Publish the owner-approved soup reel and Story once
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CPANEL_APP_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          [[ "${CPANEL_SSH_PORT:-22}" =~ ^[0-9]+$ ]] || exit 1
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -p "${CPANEL_SSH_PORT:-22}" \
            "$CPANEL_SSH_USERNAME@$CPANEL_SSH_HOST" \
            "cd '$CPANEL_APP_PATH' && . ./scripts/find-python.sh && \"\$PYTHON\" -c 'import sys; exec(compile(sys.stdin.read(),\"soup_now\",\"exec\"))' publish" \
            < deploy/command-centre/soup_now.py | tee result.json
          id=$(python3 -c 'import json; r=json.loads(open("result.json").read().splitlines()[-1]); assert r["outcome"] == "published"; print(r["draft_id"])')
          [[ "$id" =~ ^[0-9a-f]{16}$ ]] || exit 1
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -P "${CPANEL_SSH_PORT:-22}" \
            "$CPANEL_SSH_USERNAME@$CPANEL_SSH_HOST:$CPANEL_APP_PATH/data/instagram/drafts/$id/reel.mp4" reel.mp4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soup-reel-and-story
          path: |
            result.json
            reel.mp4
          retention-days: 7
