name: Deploy protected energy dashboard

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # The secrets context is not available in job-level `if:`, so check presence here.
  preflight:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - name: Check deployment secrets are configured
        id: secrets
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
          CPANEL_DASHBOARD_PATH: ${{ secrets.CPANEL_DASHBOARD_PATH }}
        run: |
          ready=true
          for value in "$CPANEL_SSH_HOST" \
            "$CPANEL_SSH_USERNAME" \
            "$CPANEL_SSH_PRIVATE_KEY" \
            "$CPANEL_SSH_KNOWN_HOSTS" \
            "$CPANEL_APP_PATH" \
            "$CPANEL_DASHBOARD_PATH"; do
            [ -n "$value" ] || ready=false
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Job-level so only runs that passed Test and preflight wait in the deploy queue.
    concurrency:
      group: deploy-dashboard
      cancel-in-progress: false
    steps:
      - name: Configure deployment key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Update, refresh, and publish dashboard
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
          CPANEL_DASHBOARD_PATH: ${{ secrets.CPANEL_DASHBOARD_PATH }}
          # Deploy exactly the commit Test checked; a newer main commit is deployed by its own run.
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes
          "$CPANEL_SSH_USERNAME@$CPANEL_SSH_HOST"
          "cd '$CPANEL_APP_PATH' && git fetch origin main &&
          if [ \"\$(git rev-parse origin/main)\" != '$DEPLOY_SHA' ]; then
          echo 'origin/main has moved past the tested commit; skipping deploy.'; exit 0; fi &&
          git reset --hard '$DEPLOY_SHA' &&
          ./scripts/start-energy.sh --days 90 &&
          DASHBOARD_TARGET='$CPANEL_DASHBOARD_PATH' ./scripts/publish-energy-dashboard.sh"
