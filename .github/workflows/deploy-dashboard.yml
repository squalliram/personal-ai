name: Deploy protected energy dashboard

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  # Secrets are available to steps, not job-level conditions.
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.configuration.outputs.ready }}
    steps:
      - name: Check deployment configuration
        id: configuration
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
          CPANEL_DASHBOARD_PATH: ${{ secrets.CPANEL_DASHBOARD_PATH }}
        run: |
          for name in CPANEL_SSH_HOST CPANEL_SSH_USERNAME CPANEL_SSH_PRIVATE_KEY CPANEL_SSH_KNOWN_HOSTS CPANEL_APP_PATH CPANEL_DASHBOARD_PATH; do
            if [ -z "${!name}" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              echo "Deployment not configured; no connection attempted."
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Different tested commits must not replace each other's pending jobs.
    # The server lock serializes checkout, collection and publication.
    concurrency:
      group: deploy-dashboard-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Configure deployment key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Update, refresh, and publish dashboard
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          # Optional; defaults to 22.
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
          CPANEL_DASHBOARD_PATH: ${{ secrets.CPANEL_DASHBOARD_PATH }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          ENERGY_REFRESH_INTERVAL_MINUTES: ${{ vars.ENERGY_REFRESH_INTERVAL_MINUTES || '60' }}
        run: |
          # Remote paths are configuration, never executable shell fragments.
          [[ "$CPANEL_APP_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          [[ "$CPANEL_DASHBOARD_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "${CPANEL_SSH_PORT:-22}" =~ ^[0-9]+$ ]] || exit 1
          [[ "${ENERGY_REFRESH_INTERVAL_MINUTES:-60}" =~ ^[1-9][0-9]*$ ]] || exit 1
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${CPANEL_SSH_PORT:-22}" \
            "$CPANEL_SSH_USERNAME@$CPANEL_SSH_HOST" \
            "cd '$CPANEL_APP_PATH' && command -v flock >/dev/null && test -d .git && \
            exec 9>.git/energy-dashboard.deploy.lock && flock -x 9 && \
            test -z \"\$(git status --porcelain)\" && \
            test \"\$(git branch --show-current)\" = main && git fetch --no-tags origin main && \
            if [ \"\$(git rev-parse origin/main)\" != '$DEPLOY_SHA' ]; then \
            echo 'origin/main has moved past the tested commit; skipping deploy.'; exit 0; fi && \
            git merge --ff-only '$DEPLOY_SHA' && test \"\$(git rev-parse HEAD)\" = '$DEPLOY_SHA' && \
            DASHBOARD_TARGET='$CPANEL_DASHBOARD_PATH' \
            ENERGY_REFRESH_INTERVAL_MINUTES='${ENERGY_REFRESH_INTERVAL_MINUTES:-60}' \
            ./scripts/install-energy-refresh.sh && \
            ENERGY_REFRESH_EXPECTED_SHA='$DEPLOY_SHA' \
            ./scripts/refresh-energy.sh --force --inherited-lock-fd 9"
      - name: Configure Instagram daily drafts
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          # Optional: unset secrets leave the server's existing values alone.
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [[ "$CPANEL_APP_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "${CPANEL_SSH_PORT:-22}" =~ ^[0-9]+$ ]] || exit 1
          # Keys travel on stdin, never in the remote command line.
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\nCLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_ACCOUNT_ID" "$CLOUDFLARE_API_TOKEN" | \
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${CPANEL_SSH_PORT:-22}" \
            "$CPANEL_SSH_USERNAME@$CPANEL_SSH_HOST" \
            "cd '$CPANEL_APP_PATH' && \
            if [ \"\$(git rev-parse HEAD)\" != '$DEPLOY_SHA' ]; then \
            echo 'Checkout is not the tested commit; skipping Instagram setup.'; exit 0; fi && \
            . ./scripts/find-python.sh && \"\$PYTHON\" -m instagram_agent.env_install --env-file .env && \
            ./scripts/install-instagram-daily.sh"
