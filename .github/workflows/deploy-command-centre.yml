name: Deploy command centre

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.configuration.outputs.ready }}
    steps:
      - name: Check deployment configuration
        id: configuration
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
          COMMAND_CENTRE_PASSWORD_HASH: ${{ secrets.COMMAND_CENTRE_PASSWORD_HASH }}
        run: |
          missing=0
          for name in CPANEL_SSH_HOST CPANEL_SSH_USERNAME CPANEL_SSH_PRIVATE_KEY CPANEL_SSH_KNOWN_HOSTS CPANEL_APP_PATH COMMAND_CENTRE_PASSWORD_HASH; do
            if [ -z "${!name}" ]; then echo "Missing secret: $name"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "Command centre deployment is not configured; no connection attempted."
            echo "See docs/command-centre/deployment.md for setup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  probe:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Configure deployment key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Probe hosting capabilities
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        run: |
          [[ "$CPANEL_APP_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          [[ "${CPANEL_SSH_PORT:-22}" =~ ^[0-9]+$ ]] || exit 1
          APP_DIR="$(dirname "$CPANEL_APP_PATH")/command-centre-app"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${CPANEL_SSH_PORT:-22}" \
            "$CPANEL_SSH_USERNAME@$CPANEL_SSH_HOST" \
            "set -e; \
            echo '== interpreters =='; \
            for p in python3.13 python3.12 python3.11 python3.10 python3; do \
              command -v \$p >/dev/null 2>&1 && \$p --version; \
            done; \
            echo '== passenger =='; \
            command -v passenger-config >/dev/null 2>&1 && echo passenger-config || true; \
            command -v cloudlinux-selector >/dev/null 2>&1 && echo cloudlinux-selector || true; \
            test -d /usr/share/passenger && echo /usr/share/passenger || true; \
            echo '== checkout =='; \
            cd '$CPANEL_APP_PATH' && git log --oneline -1 && git status --porcelain; \
            echo '== energy data =='; \
            ls data/*.sqlite3 2>/dev/null || echo 'no databases in checkout'; \
            echo '== cron =='; \
            crontab -l 2>/dev/null | grep -c personal-ai-energy-refresh || echo 'crontab unavailable'; \
            echo '== app dir =='; \
            ls '$APP_DIR' 2>/dev/null || echo 'not created yet'" | tee probe.log
          grep -qE 'Python 3\.(1[0-9]|[2-9][0-9])' probe.log || {
            echo "No Python 3.10+ interpreter found on the hosting; cannot run the command centre."
            exit 1
          }
          grep -qE 'passenger-config|cloudlinux-selector|/usr/share/passenger' probe.log || {
            echo "No Passenger or Python selector found on the hosting. See docs/command-centre/deployment.md."
            exit 1
          }
          echo "Hosting probe passed. Passenger app directory will be: $APP_DIR"

  deploy:
    needs: probe
    runs-on: ubuntu-latest
    # Different tested commits must not replace each other's pending jobs.
    concurrency:
      group: deploy-command-centre-${{ github.event.workflow_run.head_sha || github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure deployment key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Update checkout and install the Passenger app
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
          COMMAND_CENTRE_PASSWORD_HASH: ${{ secrets.COMMAND_CENTRE_PASSWORD_HASH }}
          COMMAND_CENTRE_HOSTS: ${{ vars.COMMAND_CENTRE_HOSTS || 'iramkhan.com' }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          [[ "$CPANEL_APP_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "${CPANEL_SSH_PORT:-22}" =~ ^[0-9]+$ ]] || exit 1
          [[ "$COMMAND_CENTRE_HOSTS" =~ ^[a-zA-Z0-9.,:-]+$ ]] || exit 1
          APP_DIR="$(dirname "$CPANEL_APP_PATH")/command-centre-app"
          SSH="ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p ${CPANEL_SSH_PORT:-22} $CPANEL_SSH_USERNAME@$CPANEL_SSH_HOST"
          $SSH \
            "cd '$CPANEL_APP_PATH' && command -v flock >/dev/null && test -d .git && \
            exec 9>.git/command-centre.deploy.lock && flock -x 9 && \
            test -z \"\$(git status --porcelain)\" && \
            test \"\$(git branch --show-current)\" = main && git fetch --no-tags origin main && \
            if [ \"\$(git rev-parse origin/main)\" != '$DEPLOY_SHA' ]; then \
            echo 'origin/main has moved past the tested commit; skipping deploy.'; exit 0; fi && \
            git merge --ff-only '$DEPLOY_SHA' && test \"\$(git rev-parse HEAD)\" = '$DEPLOY_SHA' && \
            install -m 700 -d '$APP_DIR' '$APP_DIR/tmp' '$APP_DIR/data'"
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -P "${CPANEL_SSH_PORT:-22}" \
            deploy/command-centre/passenger_wsgi.py \
            "$CPANEL_SSH_USERNAME@$CPANEL_SSH_HOST:$APP_DIR/passenger_wsgi.py"
          {
            printf 'COMMAND_CENTRE_PASSWORD_HASH=%s\n' "$COMMAND_CENTRE_PASSWORD_HASH"
            printf 'COMMAND_CENTRE_CHECKOUT=%s\n' "$CPANEL_APP_PATH"
            printf 'COMMAND_CENTRE_ALLOWED_HOSTS=%s\n' "$COMMAND_CENTRE_HOSTS"
            printf 'COMMAND_CENTRE_AUDIT_DB=%s\n' "$APP_DIR/data/audit.sqlite3"
            printf 'COMMAND_CENTRE_SESSIONS_DB=%s\n' "$APP_DIR/data/sessions.sqlite3"
            printf 'COMMAND_CENTRE_INSPECT_CRONTAB=1\n'
          } | $SSH "cat > '$APP_DIR/command-centre.env.new' && chmod 600 '$APP_DIR/command-centre.env.new' && \
            mv '$APP_DIR/command-centre.env.new' '$APP_DIR/command-centre.env' && touch '$APP_DIR/tmp/restart.txt'"
      - name: Verify the hosted page over HTTPS
        env:
          COMMAND_CENTRE_HOSTS: ${{ vars.COMMAND_CENTRE_HOSTS || 'iramkhan.com' }}
        run: |
          FIRST_HOST="${COMMAND_CENTRE_HOSTS%%,*}"
          for attempt in 1 2 3 4 5; do
            health=$(curl -fsS --max-time 20 "https://$FIRST_HOST/command-centre/api/v1/health") && break
            echo "attempt $attempt failed; retrying"; sleep 10
          done
          echo "$health" | grep -q '"status":"ok"'
          curl -fsS --max-time 20 "https://$FIRST_HOST/command-centre/" | grep -q "Command Centre"
          echo "Command centre is live at https://$FIRST_HOST/command-centre/"
