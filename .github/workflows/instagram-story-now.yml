name: Owner requested latte Story

on:
  push:
    branches: [devin/1763910000-ig-state-probe]
    paths:
      - .github/workflows/instagram-story-now.yml

permissions:
  contents: read

concurrency:
  group: instagram-owner-story-now
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PHASE: story
      DRAFT_ID: '4025e9735f1332fc'
    steps:
      - uses: actions/checkout@v4
      - name: Publish the explicitly requested Story once
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CPANEL_APP_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          [[ "${CPANEL_SSH_PORT:-22}" =~ ^[0-9]+$ ]] || exit 1
          [[ "$PHASE" == story && "$DRAFT_ID" == 4025e9735f1332fc ]] || exit 1
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -p "${CPANEL_SSH_PORT:-22}" \
            "$CPANEL_SSH_USERNAME@$CPANEL_SSH_HOST" \
            "cd '$CPANEL_APP_PATH' && . ./scripts/find-python.sh && \"\$PYTHON\" - '$PHASE' '$DRAFT_ID'" \
            < deploy/command-centre/story_now.py
