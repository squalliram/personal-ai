name: Inspect command centre hosting

on:
  push:
    branches: [droid/command-centre-live]
    paths:
      - .github/workflows/probe-command-centre.yml
      - deploy/command-centre/probe_host.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect hosting without changing it
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CPANEL_APP_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          [[ "${CPANEL_SSH_PORT:-22}" =~ ^[0-9]+$ ]] || exit 1
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -p "${CPANEL_SSH_PORT:-22}" \
            "$CPANEL_SSH_USERNAME@$CPANEL_SSH_HOST" \
            "python3 - '$CPANEL_APP_PATH'" < deploy/command-centre/probe_host.py
      - name: Check public access from an independent network
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None

          base = "https://iramkhan.com/command-centre"
          cases = [
              ("health", base + "/api/v1/health", {}, 200, b'{"status":"ok"}'),
              ("login", base + "/", {}, 200, b"Command Centre"),
              ("javascript", base + "/static/app.js", {}, 200, b"api/v1/"),
              ("stylesheet", base + "/static/app.css", {}, 200, b"{"),
              ("protected_energy", base + "/api/v1/energy", {}, 401, None),
              ("http", base.replace("https:", "http:") + "/api/v1/health", {}, None, None),
              ("http_spoof", base.replace("https:", "http:") + "/api/v1/health",
               {"X-Forwarded-Proto": "https"}, None, None),
          ]
          results = []
          release = None
          for name, url, headers, expected, needle in cases:
              try:
                  try:
                      response = build_opener(NoRedirect()).open(Request(url, headers=headers), timeout=15)
                  except HTTPError as error:
                      response = error
                  with response:
                      body = response.read(2 * 1024 * 1024)
                      sha = response.headers.get("X-Command-Centre-Release", "")
                      sha = sha if re.fullmatch(r"[a-f0-9]{40}", sha) else None
                      transport = response.headers.get("X-Command-Centre-Transport", "")
                      transport = transport if re.fullmatch(r"tls=[01];port=(80|443|other)", transport) else None
                      if name == "health":
                          release = sha
                      if expected is None:
                          ok = response.status in (301, 302, 307, 308)
                          ok = ok and response.headers.get("Location") == base + "/api/v1/health"
                      else:
                          ok = response.status == expected and bool(release) and sha == release
                          ok = ok and (needle is None or needle in body)
                          ok = ok and response.headers.get("X-Content-Type-Options") == "nosniff"
                          ok = ok and bool(response.headers.get("Strict-Transport-Security"))
                      results.append({"check": name, "status": response.status, "ok": ok,
                                      "release": sha, "transport": transport})
              except Exception as error:
                  results.append({"check": name, "ok": False, "error": type(error).__name__})
          print(json.dumps({"public_checks": results, "all_passed": all(r["ok"] for r in results)}))
          raise SystemExit(0 if all(r["ok"] for r in results) else 1)
          PY
