name: Reel polish preview (no Instagram writes)
on:
  push:
    branches: [devin/1795538986-reel-polish]
    paths: [.github/workflows/real-reel-preview.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Render private preview from read-only copies
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
          PREVIEW_AGE_RECIPIENT: age17egu38dfsy408kx93ncv9pp4kescn3236x5j3kktgxgtrannl9ussyukff
          PREVIEW_OUTPUT: ${{ runner.temp }}/preview.tar.gz.age
        run: |
          set -euo pipefail
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          python scripts/real-reel-preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-reel-polish-encrypted
          path: ${{ runner.temp }}/preview.tar.gz.age
          if-no-files-found: error
          retention-days: 3
