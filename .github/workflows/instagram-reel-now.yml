name: Owner requested photo reel test

on:
  push:
    branches: [devin/1763910000-ig-state-probe]
    paths:
      - .github/workflows/instagram-reel-now.yml
      - deploy/command-centre/reel_now.py

permissions:
  contents: read

concurrency:
  group: instagram-reel-now
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHASE: publish
      DRAFT_ID: '4025e9735f1332fc'
    steps:
      - uses: actions/checkout@v4
      - name: Run selected reel phase
        env:
          CPANEL_SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          CPANEL_SSH_USERNAME: ${{ secrets.CPANEL_SSH_USERNAME }}
          CPANEL_SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          CPANEL_SSH_KNOWN_HOSTS: ${{ secrets.CPANEL_SSH_KNOWN_HOSTS }}
          CPANEL_APP_PATH: ${{ secrets.CPANEL_APP_PATH }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CPANEL_APP_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          [[ "${CPANEL_SSH_PORT:-22}" =~ ^[0-9]+$ ]] || exit 1
          [[ "$PHASE" == draft || "$PHASE" == publish ]] || exit 1
          [[ -z "$DRAFT_ID" || "$DRAFT_ID" =~ ^[0-9a-f]{16}$ ]] || exit 1
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -p "${CPANEL_SSH_PORT:-22}" \
            "$CPANEL_SSH_USERNAME@$CPANEL_SSH_HOST" \
            "cd '$CPANEL_APP_PATH' && . ./scripts/find-python.sh && \"\$PYTHON\" - '$PHASE' '$DRAFT_ID'" \
            < deploy/command-centre/reel_now.py | tee result.json
          if [[ "$PHASE" == draft ]]; then
            id=$(python3 -c 'import json; r=json.load(open("result.json")); assert not r.get("error") and r["kind"] == "reel" and r["render"] == "done" and r["file_size"] > 0; print(r["draft_id"])')
            [[ "$id" =~ ^[0-9a-f]{16}$ ]] || exit 1
            scp -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -P "${CPANEL_SSH_PORT:-22}" \
              "$CPANEL_SSH_USERNAME@$CPANEL_SSH_HOST:$CPANEL_APP_PATH/data/instagram/drafts/$id/reel.mp4" reel.mp4
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-photo-reel-preview
          path: |
            result.json
            reel.mp4
          retention-days: 7
