[project]
name = "personal-ai"
version = "0.1.0"
description = "Read-only daily intelligence briefings and Octopus Energy consumption analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Keep in sync with the version pinned in .github/workflows/test.yml.
dev = ["ruff==0.16.10"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
